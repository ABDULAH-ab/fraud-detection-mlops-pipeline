global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fraud-inference-api
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-api:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
