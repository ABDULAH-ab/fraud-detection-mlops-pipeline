name: Fraud MLOps CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  repository_dispatch:
    types: [model_performance_drop, data_drift_alert]

env:
  PYTHON_VERSION: "3.10"
  TRAINING_IMAGE: ghcr.io/${{ github.repository }}/fraud-training
  INFERENCE_IMAGE: ghcr.io/${{ github.repository }}/fraud-inference
  ALERT_BRIDGE_IMAGE: ghcr.io/${{ github.repository }}/alert-bridge
  K8S_NAMESPACE: fraud-mlops

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Data validation checks
        run: |
          if [ -f data/train_transaction.csv ]; then
            python ci/data_validation_check.py --data data/train_transaction.csv
          else
            echo "No data/train_transaction.csv found; skipping data validation check in CI"
          fi

  build-package:
    runs-on: ubuntu-latest
    needs: [lint-test]
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/training.Dockerfile
          push: true
          tags: |
            ${{ env.TRAINING_IMAGE }}:${{ github.sha }}
            ${{ env.TRAINING_IMAGE }}:latest
      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/inference.Dockerfile
          push: true
          tags: |
            ${{ env.INFERENCE_IMAGE }}:${{ github.sha }}
            ${{ env.INFERENCE_IMAGE }}:latest
      - name: Build and push alert bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alert-bridge.Dockerfile
          push: true
          tags: |
            ${{ env.ALERT_BRIDGE_IMAGE }}:${{ github.sha }}
            ${{ env.ALERT_BRIDGE_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install kubeflow compiler deps
        run: |
          python -m pip install --upgrade pip
          pip install kfp
      - name: Compile Kubeflow pipeline
        run: |
          cd kubeflow
          python compile_pipeline.py
      - name: Trigger Kubeflow run
        env:
          KFP_HOST: ${{ secrets.KFP_HOST }}
          KFP_TOKEN: ${{ secrets.KFP_TOKEN }}
        run: |
          python ci/trigger_kubeflow_run.py \
            --pipeline kubeflow/fraud_pipeline.yaml \
            --experiment fraud-detection \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --run-prefix deploy \
            --allow-skip
      - name: Configure kubeconfig (optional)
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
      - name: Install kubectl
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        uses: azure/setup-kubectl@v4
      - name: Deploy updated inference service
        if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
        run: |
          chmod +x ci/deploy_inference_service.sh
          ci/deploy_inference_service.sh "${{ env.INFERENCE_IMAGE }}:${{ github.sha }}" "${{ env.K8S_NAMESPACE }}"

  intelligent-retrain:
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name == 'repository_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Kubeflow client
        run: |
          python -m pip install --upgrade pip
          pip install kfp
      - name: Trigger retraining from monitoring alert
        env:
          KFP_HOST: ${{ secrets.KFP_HOST }}
          KFP_TOKEN: ${{ secrets.KFP_TOKEN }}
        run: |
          echo "Dispatch trigger type: ${{ github.event.action }}"
          python ci/trigger_kubeflow_run.py \
            --pipeline kubeflow/fraud_pipeline.yaml \
            --experiment fraud-detection \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --run-prefix "alert-${{ github.event.action }}" \
            --allow-skip

  evidence:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Upload workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-evidence-${{ github.run_id }}
          path: |
            kubeflow/fraud_pipeline.yaml
            .github/workflows/mlops-ci-cd.yml
            ci/trigger_kubeflow_run.py
            ci/deploy_inference_service.sh
            docker/alert-bridge.Dockerfile
            kubernetes/alert-bridge.yaml
