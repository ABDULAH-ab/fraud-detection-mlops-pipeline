# PIPELINE DEFINITION
# Name: fraud-detection-mlops-pipeline
# Inputs:
#    data_uri: str
#    model_registry_uri: str [Default: '/tmp/model_registry']
components:
  comp-condition-1:
    dag:
      tasks:
        conditional-deployment:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-conditional-deployment
          inputs:
            artifacts:
              metrics_path:
                componentInputArtifact: pipelinechannel--model-evaluation-metrics_path
              model_path:
                componentInputArtifact: pipelinechannel--model-training-model_path
            parameters:
              model_registry_uri:
                componentInputParameter: pipelinechannel--model_registry_uri
          taskInfo:
            name: conditional-deployment
    inputDefinitions:
      artifacts:
        pipelinechannel--model-evaluation-metrics_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        pipelinechannel--model-training-model_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--model-evaluation-deploy_decision:
          parameterType: STRING
        pipelinechannel--model_registry_uri:
          parameterType: STRING
  comp-conditional-deployment:
    executorLabel: exec-conditional-deployment
    inputDefinitions:
      artifacts:
        metrics_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        model_registry_uri:
          parameterType: STRING
  comp-data-ingestion:
    executorLabel: exec-data-ingestion
    inputDefinitions:
      parameters:
        data_uri:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        dataset_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-data-preprocessing:
    executorLabel: exec-data-preprocessing
    inputDefinitions:
      artifacts:
        validated_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        preprocessed_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-data-validation:
    executorLabel: exec-data-validation
    inputDefinitions:
      artifacts:
        dataset_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        validated_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-feature-engineering:
    executorLabel: exec-feature-engineering
    inputDefinitions:
      artifacts:
        preprocessed_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        features_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-model-evaluation:
    executorLabel: exec-model-evaluation
    inputDefinitions:
      artifacts:
        features_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        deploy_decision:
          parameterType: STRING
  comp-model-training:
    executorLabel: exec-model-training
    inputDefinitions:
      artifacts:
        features_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        training_report_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-conditional-deployment:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - conditional_deployment
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef conditional_deployment(\n    model_path: Input[Dataset],\n  \
          \  metrics_path: Input[Dataset],\n    model_registry_uri: str,\n) -> None:\n\
          \    import json\n    import shutil\n    from pathlib import Path\n\n  \
          \  with open(metrics_path.path, \"r\", encoding=\"utf-8\") as fp:\n    \
          \    metrics = json.load(fp)\n\n    destination = Path(model_registry_uri)\n\
          \    destination.mkdir(parents=True, exist_ok=True)\n    shutil.copy(model_path.path,\
          \ destination / \"model.joblib\")\n    with open(destination / \"metrics.json\"\
          , \"w\", encoding=\"utf-8\") as fp:\n        json.dump(metrics, fp, indent=2)\n\
          \n"
        image: python:3.10-slim
    exec-data-ingestion:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_ingestion
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_ingestion(data_uri: str, dataset_path: Output[Dataset])\
          \ -> None:\n    import pandas as pd\n    import os\n\n    # If data_uri\
          \ is a path that doesn't exist, create synthetic data\n    if not os.path.exists(data_uri)\
          \ and data_uri.startswith('/mnt/artifacts'):\n        print(f\"\u26A0 Data\
          \ file not found: {data_uri}, creating synthetic dataset\")\n        # Create\
          \ a small synthetic fraud dataset\n        import numpy as np\n        np.random.seed(42)\n\
          \n        n_samples = 5000\n        data = {\n            'TransactionID':\
          \ np.arange(n_samples),\n            'TransactionDT': np.random.randint(86400,\
          \ 180000, n_samples),\n            'TransactionAmt': np.random.exponential(100,\
          \ n_samples),\n            'isFraud': np.random.binomial(1, 0.001, n_samples),\n\
          \        }\n\n        # Add more features to match pipeline expectations\n\
          \        for i in range(10):\n            data[f'V{i}'] = np.random.normal(0,\
          \ 1, n_samples)\n\n        df = pd.DataFrame(data)\n        print(f\"Created\
          \ synthetic dataset: {df.shape}\")\n    else:\n        # Use provided data\
          \ file\n        df = pd.read_csv(data_uri)\n        print(f\"Loaded dataset:\
          \ {df.shape}\")\n\n    df.to_csv(dataset_path.path, index=False)\n\n"
        image: python:3.10-slim
    exec-data-preprocessing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_preprocessing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_preprocessing(validated_path: Input[Dataset], preprocessed_path:\
          \ Output[Dataset]) -> None:\n    import pandas as pd\n    from sklearn.experimental\
          \ import enable_iterative_imputer  # noqa: F401\n    from sklearn.impute\
          \ import IterativeImputer\n\n    df = pd.read_csv(validated_path.path)\n\
          \    num_cols = df.select_dtypes(include=[\"number\"]).columns.tolist()\n\
          \    for col in [\"TransactionID\", \"TransactionDT\", \"isFraud\"]:\n \
          \       if col in num_cols:\n            num_cols.remove(col)\n\n    if\
          \ num_cols:\n        imputer = IterativeImputer(max_iter=5, random_state=42)\n\
          \        df[num_cols] = imputer.fit_transform(df[num_cols])\n\n    for col\
          \ in df.columns:\n        if col not in num_cols and df[col].dtype == \"\
          object\":\n            df[col] = df[col].fillna(\"__missing__\")\n\n   \
          \ df.to_csv(preprocessed_path.path, index=False)\n\n"
        image: python:3.10-slim
    exec-data-validation:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_validation
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_validation(dataset_path: Input[Dataset], validated_path:\
          \ Output[Dataset]) -> None:\n    import pandas as pd\n\n    required = {\"\
          TransactionID\", \"TransactionDT\", \"isFraud\"}\n    df = pd.read_csv(dataset_path.path)\n\
          \    missing = required - set(df.columns)\n    if missing:\n        raise\
          \ ValueError(f\"Validation failed; missing columns: {sorted(missing)}\"\
          )\n\n    df.to_csv(validated_path.path, index=False)\n\n"
        image: python:3.10-slim
    exec-feature-engineering:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_engineering
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef feature_engineering(preprocessed_path: Input[Dataset], features_path:\
          \ Output[Dataset]) -> None:\n    import pandas as pd\n\n    df = pd.read_csv(preprocessed_path.path)\n\
          \    if \"TransactionAmt\" in df.columns:\n        rolling = df[\"TransactionAmt\"\
          ].rolling(window=10, min_periods=1).mean()\n        df[\"TransactionAmt_rolling_mean_10\"\
          ] = rolling\n\n    df.to_csv(features_path.path, index=False)\n\n"
        image: python:3.10-slim
    exec-model-evaluation:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_evaluation
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'lightgbm' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_evaluation(\n    features_path: Input[Dataset],\n    model_path:\
          \ Input[Dataset],\n    metrics_path: Output[Dataset],\n)-> NamedTuple(\"\
          EvaluationOutput\", [(\"deploy_decision\", str)]):\n    import json\n\n\
          \    import joblib\n    import pandas as pd\n    from sklearn.metrics import\
          \ f1_score, precision_score, recall_score, roc_auc_score\n\n    artifact\
          \ = joblib.load(model_path.path)\n    model = artifact[\"model\"]\n    columns\
          \ = artifact[\"columns\"]\n\n    df = pd.read_csv(features_path.path)\n\
          \    y = df[\"isFraud\"].astype(int)\n    x = df.drop(columns=[c for c in\
          \ [\"isFraud\", \"TransactionID\", \"TransactionDT\"] if c in df.columns])\n\
          \    x = pd.get_dummies(x, drop_first=False)\n    x = x.reindex(columns=columns,\
          \ fill_value=0)\n\n    preds = model.predict(x)\n    probs = model.predict_proba(x)[:,\
          \ 1]\n    metrics: Dict[str, float] = {\n        \"precision\": float(precision_score(y,\
          \ preds, zero_division=0)),\n        \"recall\": float(recall_score(y, preds,\
          \ zero_division=0)),\n        \"f1\": float(f1_score(y, preds, zero_division=0)),\n\
          \        \"auc_roc\": float(roc_auc_score(y, probs)),\n    }\n\n    with\
          \ open(metrics_path.path, \"w\", encoding=\"utf-8\") as fp:\n        json.dump(metrics,\
          \ fp)\n\n    should_deploy = metrics[\"auc_roc\"] >= 0.75 and metrics[\"\
          recall\"] >= 0.80\n    output = NamedTuple(\"EvaluationOutput\", [(\"deploy_decision\"\
          , str)])\n    return output(\"true\" if should_deploy else \"false\")\n\n"
        image: python:3.10
    exec-model-training:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_training
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'lightgbm' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_training(\n    features_path: Input[Dataset],\n    model_path:\
          \ Output[Dataset],\n    training_report_path: Output[Dataset],\n) -> None:\n\
          \    import json\n\n    import joblib\n    import pandas as pd\n    from\
          \ lightgbm import LGBMClassifier\n\n    df = pd.read_csv(features_path.path)\n\
          \    y = df[\"isFraud\"].astype(int)\n    x = df.drop(columns=[c for c in\
          \ [\"isFraud\", \"TransactionID\", \"TransactionDT\"] if c in df.columns])\n\
          \    x = pd.get_dummies(x, drop_first=False)\n\n    model = LGBMClassifier(n_estimators=150,\
          \ learning_rate=0.05, random_state=42)\n    model.fit(x, y)\n\n    joblib.dump({\"\
          model\": model, \"columns\": x.columns.tolist()}, model_path.path)\n   \
          \ with open(training_report_path.path, \"w\", encoding=\"utf-8\") as fp:\n\
          \        json.dump({\"rows\": len(df), \"features\": len(x.columns)}, fp)\n\
          \n"
        image: python:3.10
pipelineInfo:
  name: fraud-detection-mlops-pipeline
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - model-evaluation
        - model-training
        inputs:
          artifacts:
            pipelinechannel--model-evaluation-metrics_path:
              taskOutputArtifact:
                outputArtifactKey: metrics_path
                producerTask: model-evaluation
            pipelinechannel--model-training-model_path:
              taskOutputArtifact:
                outputArtifactKey: model_path
                producerTask: model-training
          parameters:
            pipelinechannel--model-evaluation-deploy_decision:
              taskOutputParameter:
                outputParameterKey: deploy_decision
                producerTask: model-evaluation
            pipelinechannel--model_registry_uri:
              componentInputParameter: model_registry_uri
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--model-evaluation-deploy_decision']
            == 'true'
      data-ingestion:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-ingestion
        inputs:
          parameters:
            data_uri:
              componentInputParameter: data_uri
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: data-ingestion
      data-preprocessing:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-preprocessing
        dependentTasks:
        - data-validation
        inputs:
          artifacts:
            validated_path:
              taskOutputArtifact:
                outputArtifactKey: validated_path
                producerTask: data-validation
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: data-preprocessing
      data-validation:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-validation
        dependentTasks:
        - data-ingestion
        inputs:
          artifacts:
            dataset_path:
              taskOutputArtifact:
                outputArtifactKey: dataset_path
                producerTask: data-ingestion
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: data-validation
      feature-engineering:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feature-engineering
        dependentTasks:
        - data-preprocessing
        inputs:
          artifacts:
            preprocessed_path:
              taskOutputArtifact:
                outputArtifactKey: preprocessed_path
                producerTask: data-preprocessing
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: feature-engineering
      model-evaluation:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-evaluation
        dependentTasks:
        - feature-engineering
        - model-training
        inputs:
          artifacts:
            features_path:
              taskOutputArtifact:
                outputArtifactKey: features_path
                producerTask: feature-engineering
            model_path:
              taskOutputArtifact:
                outputArtifactKey: model_path
                producerTask: model-training
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: model-evaluation
      model-training:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-training
        dependentTasks:
        - feature-engineering
        inputs:
          artifacts:
            features_path:
              taskOutputArtifact:
                outputArtifactKey: features_path
                producerTask: feature-engineering
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: model-training
  inputDefinitions:
    parameters:
      data_uri:
        parameterType: STRING
      model_registry_uri:
        defaultValue: /tmp/model_registry
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
