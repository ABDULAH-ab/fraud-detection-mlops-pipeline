apiVersion: v1
kind: Pod
metadata:
  name: data-loader
  namespace: fraud-mlops
spec:
  containers:
  - name: data-loader
    image: busybox
    command: ['sleep', '3600']
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    volumeMounts:
    - name: artifacts
      mountPath: /mnt/artifacts
  volumes:
  - name: artifacts
    persistentVolumeClaim:
      claimName: pipeline-artifacts-pvc
